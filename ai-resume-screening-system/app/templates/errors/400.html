{% extends "base.html" %}

{% block title %}400 Bad Request - AI Resume Screening{% endblock %}

    <div class="card" style="max-width: 460px; padding: 3rem 2rem;">
        <h1 style="font-size: 4rem; font-weight: 800; color: #f59e0b; margin-bottom: 0.5rem;">400</h1>
        <h2 style="font-size: 1.25rem; font-weight: 700; color: var(--text-white); margin-bottom: 0.75rem;">Bad Request</h2>

        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
